name: Build DSI Desktop HTML Skin APK v17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand independent DSI project
        shell: bash
        run: >-
          set -e;
          test -f DSI-desktop-html-v17-source.zip;
          mkdir -p .dsi-source;
          unzip -q -o DSI-desktop-html-v17-source.zip -d .dsi-source;
          project_root=$(find .dsi-source -type f -name settings.gradle -printf '%h\n' | head -n 1);
          test -n "$project_root";
          cp -a "$project_root"/. .;
          test -f settings.gradle;
          test -f app/build.gradle;
          test -f app/src/main/AndroidManifest.xml;
          test -f app/src/main/java/com/dsi/real/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSI-desktop-html-skin-apk-v17
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
